<!doctype html>
<html>
<head>
  <title>3D Truck with Expanding Ring Impulse</title>
  <script src="/dist/threebox.js" type="text/javascript"></script>
  <link href="/dist/threebox.css" rel="stylesheet" />
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.2.0/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.2.0/mapbox-gl.js"></script>
  <script src="https://d3js.org/d3.v5.min.js"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: black;
    }
    #map {
      width: 100%;
      height: 100%;
    }
    #explainer {
      z-index: 99;
      position: absolute;
      color: white;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.5);
      padding: 5px 10px;
      border-radius: 4px;
      font-family: sans-serif;
    }
  </style>
</head>
<body>
  <div id='map'></div>
  <div id='explainer'>Click on the map to drive the truck there</div>

  <script type="module">
    const config = {
      accessToken: 'pk.eyJ1IjoidG1ha3N5bTE5OSIsImEiOiJjbWJhNHFoOWYweTM0MmxzMTl5djc2d3pjIn0.o_sSy8F6lOqyuLvYZxO9zQ'
    };

    mapboxgl.accessToken = config.accessToken;

    let origin = [-122.4340, 37.7353];
    let truck, line;

    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/streets-v11',
      center: origin,
      zoom: 16,
      pitch: 60,
      bearing: 90,
      antialias: true
    });

    import Stats from 'https://threejs.org/examples/jsm/libs/stats.module.js';
    let stats;

    function animate() {
      requestAnimationFrame(animate);
      stats.update();
    }

    map.on('style.load', () => {
      stats = new Stats();
      map.getContainer().appendChild(stats.dom);
      animate();

      map.addLayer({
        id: 'custom_layer',
        type: 'custom',
        renderingMode: '3d',
        onAdd: function (map, mbxContext) {
          window.tb = new Threebox(map, mbxContext, { defaultLights: true });

          const truckOptions = {
            type: 'gltf',
            obj: 'model/car.glb',
            scale: 40,
            units: 'meters',
            anchor: "bottom",
            rotation: { x: 90, y: 90, z: 0 }
          };

          tb.loadObj(truckOptions, function (model) {
            truck = model.setCoords(origin);
            tb.add(truck);

            // Ring impulse every second

          });
        },
        render: function () {
          tb.update();
        }
      });
    });

    map.on('load', function () {
      const layers = map.getStyle().layers;
      const labelLayerId = layers.find(
        layer => layer.type === 'symbol' && layer.layout['text-field']
      )?.id;

      map.addLayer({
        'id': '3d-buildings',
        'source': 'composite',
        'source-layer': 'building',
        'filter': ['==', 'extrude', 'true'],
        'type': 'fill-extrusion',
        'minzoom': 15,
        'paint': {
          'fill-extrusion-color': '#aaa',
          'fill-extrusion-height': ['get', 'height'],
          'fill-extrusion-base': ['get', 'min_height'],
          'fill-extrusion-opacity': 0.6
        }
      }, labelLayerId);
    });

    map.on('click', function (e) {
      const pt = [e.lngLat.lng, e.lngLat.lat];
      travelPath(pt);
    });

    function travelPath(dest) {
        const url = `https://api.mapbox.com/directions/v5/mapbox/driving/${origin.join(',')};${dest.join(',')}?geometries=geojson&access_token=${config.accessToken}`;

        fetch(url)
            .then(response => response.json())
            .then(data => {
            const coordinates = data.routes[0].geometry.coordinates;
            const options = { path: coordinates, duration: 10000 };

            let pulseInterval = null;

            // Start pulses when truck is moving
            pulseInterval = setInterval(() => {
                if (truck && truck.coordinates) {
                createRingImpulse(truck.coordinates);
                }
            }, 1000);

            truck.followPath(options, () => {
                tb.remove(line);
                clearInterval(pulseInterval); // Stop pulses when done
            });

            const lineGeometry = coordinates.map(coord => coord.concat([15]));
            line = tb.line({ geometry: lineGeometry, width: 5, color: 'steelblue' });
            tb.add(line);
            origin = dest;
            });
    }

    function createRingImpulse(coords) {
        const baseRadius = 0.5; // Starting radius in meters
        const duration = 1000;  // Ring lasts 1 second

        // Estimate visual size based on zoom (larger zoom → smaller radius needed)
        const zoom = map.getZoom();
        const maxRadius = 2 ** (20 - zoom); // Adjust for visual consistency

        const ringMaterial = new THREE.MeshBasicMaterial({
            color: 0x00ffff,
            transparent: true,
            opacity: 0.8,
            side: THREE.DoubleSide,
            depthWrite: false
        });

        const ringGeometry = new THREE.RingGeometry(baseRadius * 0.95, baseRadius, 64);
        const ringMesh = new THREE.Mesh(ringGeometry, ringMaterial);
        ringMesh.rotation.x = Math.PI / 2;

        const ring = tb.Object3D({ obj: ringMesh });
        ring.setCoords(coords);
        tb.add(ring);

        const start = performance.now();

        function animateRing(now) {
            const elapsed = now - start;
            const t = elapsed / duration;

            if (t >= 1) {
            if (ring && ringMesh) {
                tb.remove(ring);
                if (ringMesh.geometry) ringMesh.geometry.dispose();
                if (ringMesh.material) ringMesh.material.dispose();
            }
            return;
            }

            const currentRadius = baseRadius + t * (maxRadius - baseRadius);
            ringMesh.scale.set(currentRadius / baseRadius, currentRadius / baseRadius, 1);
            ringMaterial.opacity = 0.8 * (1 - t);

            requestAnimationFrame(animateRing);
        }

        requestAnimationFrame(animateRing);
    }
        // **Persistent Impulse Effect**
    function createPersistentImpulse(coords) {
        function triggerImpulse() {
            createRingImpulse(coords); // Calls impulse function
            setTimeout(triggerImpulse, 1000); // Repeat every second
        }

        triggerImpulse(); // Start looping impulses
    }

  </script>
</body>
</html>
